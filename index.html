<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game - Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="instructions">
        <h3>Car Controls</h3>
        <p><b>Up Arrow / W:</b> Accelerate</p>
        <p><b>Down Arrow / S:</b> Brake / Reverse</p>
        <p><b>Left/Right Arrow (A/D):</b> Steer</p>
    </div>

    <script>
        // 1. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky color

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 3. Track / Ground
        const groundGeo = new THREE.PlaneGeometry(100, 1000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 4. Car Object (Simple 3D Mesh)
        const carGroup = new THREE.Group();
        
        // Car Body
        const bodyGeo = new THREE.BoxGeometry(2, 1, 4);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff0000 }); // Red Color
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.8;
        carGroup.add(carBody);

        // Car Roof
        const roofGeo = new THREE.BoxGeometry(1.6, 0.7, 2);
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const carRoof = new THREE.Mesh(roofGeo, roofMat);
        carRoof.position.set(0, 1.5, -0.2);
        carGroup.add(carRoof);

        scene.add(carGroup);

        // 5. Controls Logic
        const keys = {};
        let speed = 0;
        const maxSpeed = 0.8;
        const acceleration = 0.015;
        const friction = 0.98;
        let steeringAngle = 0;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // 6. Game Loop / Animation
        function animate() {
            requestAnimationFrame(animate);

            // Forward / Backward Acceleration
            if (keys['arrowup'] || keys['w']) {
                if (speed < maxSpeed) speed += acceleration;
            } else if (keys['arrowdown'] || keys['s']) {
                if (speed > -maxSpeed / 2) speed -= acceleration;
            } else {
                speed *= friction; // Slow down when no key pressed
            }

            // Steering
            if (keys['arrowleft'] || keys['a']) {
                if (Math.abs(speed) > 0.01) carGroup.rotation.y += 0.03 * (speed > 0 ? 1 : -1);
            }
            if (keys['arrowright'] || keys['d']) {
                if (Math.abs(speed) > 0.01) carGroup.rotation.y -= 0.03 * (speed > 0 ? 1 : -1);
            }

            // Move Car Forward
            carGroup.translateZ(-speed);

            // Follow Camera Setup
            const cameraOffset = new THREE.Vector3(0, 5, 10);
            cameraOffset.applyQuaternion(carGroup.quaternion);
            camera.position.copy(carGroup.position).add(cameraOffset);
            camera.lookAt(carGroup.position);

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
